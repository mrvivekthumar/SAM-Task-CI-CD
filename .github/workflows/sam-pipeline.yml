name: SAM CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - 'develop/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  STACK_NAME: Task-SAM-SQS-Consumer

jobs:

  sam-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: SAM Validate
        run: sam validate --lint

      - name: Python Lint Check
        run: |
          flake8 src/ --max-line-length=120

      - name: Detect Layer Changes
        id: layer-check
        run: |
          echo "Checking for layer dependency changes..."
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
          if git diff --name-only HEAD~1 HEAD | grep 'layers/common/requirements.txt'; then
            echo "Layer requirements changed"
            echo "layer_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No layer changes detected"
            echo "layer_changed=false" >> $GITHUB_OUTPUT
          fi
          else
          echo "Previous commit not found, forcing layer build"
          echo "layer_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Layer Dependencies
        if: steps.layer-check.outputs.layer_changed == 'true'
        run: |
          rm -rf layers/common/python
          mkdir -p layers/common/python

          pip install \
            -r layers/common/requirements.txt \
            -t layers/common/python

      - name: SAM Build
        run: sam build --cached

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name $STACK_NAME \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Trigger SQS Message
        run: |

          echo "Fetching Queue URL from CloudFormation outputs..."

          QUEUE_URL=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='QueueUrl'].OutputValue" \
            --output text \
            --region $AWS_REGION)

          if [ -z "$QUEUE_URL" ]; then
            echo "Queue URL not found"
            exit 1
          fi

          echo "Sending deployment verification message to SQS..."

          aws sqs send-message \
            --queue-url "$QUEUE_URL" \
            --message-body '{"task":"deployment_success","trigger":"github_actions","environment":"develop"}' \
            --region $AWS_REGION

          echo "SQS message sent successfully"

      - name: Deployment Success
        run: |
          echo "SAM deployment completed successfully"